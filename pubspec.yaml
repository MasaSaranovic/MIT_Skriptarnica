name: skriptarnicaftn
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter

  # IOS style icons
  cupertino_icons: ^1.0.8
  # Icons
  ionicons: ^0.2.2
  # UI
  fancy_shimmer_image: ^2.0.3
  dynamic_height_grid_view: ^0.0.4
  card_swiper: ^3.0.1
  image_picker: 0.8.7+5
  # Utils
  uuid: ^3.0.7
  # State Management
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/user/
    - assets/user/bag/
    - assets/user/banners/
    - assets/user/categories/
    - assets/user/profile/
